name: Vercel deployment smoke test

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed Vercel base URL"
        required: false
        default: "https://mlb-terminal.vercel.app"
        type: string

jobs:
  smoke:
    name: API deployment smoke test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    env:
      VERCEL_SMOKE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.base_url || github.event.deployment_status.environment_url || vars.VERCEL_SMOKE_BASE_URL || 'https://www.lukerumpler.com' }}
      VERCEL_SMOKE_TIMEOUT_MS: "15000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect Vercel deployment protection
        shell: bash
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$VERCEL_SMOKE_BASE_URL/api/health" || true)
          if [[ "$status" == "401" || "$status" == "403" ]]; then
            echo "Vercel deployment protection returned HTTP $status; skipping unauthenticated smoke assertions."
            echo "VERCEL_SMOKE_SKIP=true" >> "$GITHUB_ENV"
          fi

      - name: Run Vercel API smoke test
        run: pnpm test:smoke
