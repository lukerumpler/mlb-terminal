name: Uptime monitor validation

on:
  pull_request:
  push:
    branches:
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: uptime-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  migration-drift:
    name: Migration drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # drizzle.config.ts requires a URL for generation. This endpoint is
      # intentionally non-routable and does not contain a production credential.
      DATABASE_URL: mysql://migration_check:migration_check@127.0.0.1:3306/migration_check
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate migration and fail on uncommitted drift
        run: |
          pnpm exec drizzle-kit generate
          git diff --exit-code -- drizzle

  validate:
    name: Tests, types, and build
    needs: migration-drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # This fixture value only lets mocked LLM transport tests exercise retry logic.
      BUILT_IN_FORGE_API_KEY: test-only-key
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Run focused uptime tests
        run: pnpm test -- server/api/uptime-monitor.test.ts server/api/uptime-monitor.route.test.ts

      - name: Run complete test suite
        run: pnpm test -- --maxWorkers=1

      - name: Build production bundle
        run: pnpm build

  notify-migration-drift:
    name: Alert on migration drift
    needs: migration-drift
    if: ${{ always() && needs.migration-drift.result == 'failure' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add or update a visible PR warning
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- migration-drift-alert -->';
            const body = `${marker}
            ## Migration-drift check failed

            The generated Drizzle migration state differs from the committed files. Do **not** merge or run a database migration until the branch is rebased and the generated migration, snapshot, and journal changes have been reviewed.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

  clear-migration-drift-alert:
    name: Clear resolved migration-drift alert
    needs: migration-drift
    if: ${{ always() && needs.migration-drift.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove any stale PR warning
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- migration-drift-alert -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.deleteComment({
                owner, repo, comment_id: existing.id,
              });
            }
