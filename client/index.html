<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SKIP · Scouting Knowledge & Intelligence Platform</title>
    <meta name="description" content="SKIP is a baseball intelligence terminal for scouting, prospect evaluation, and roster decisions — live MLB stats, MiLB prospect tracking, and SKIP's own decision-score models in one dashboard." />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1117" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="SKIP · Scouting Knowledge & Intelligence Platform" />
    <meta property="og:description" content="A baseball intelligence terminal for scouting, prospect evaluation, and roster decisions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SKIP · Scouting Knowledge & Intelligence Platform" />
    <meta name="twitter:description" content="A baseball intelligence terminal for scouting, prospect evaluation, and roster decisions." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:ital,wght@0,600;0,700;1,500&display=swap" />
    <style>
      :root {
        --bg:#FAF7F2; --surface:#FFFFFF; --surface2:#F5F0E8; --surface3:#EDE6D6;
        --border:#E2D9C8; --border-light:#EDE6D6;
        --text:#2C1810; --text2:#6B4C3B; --text3:#876B58; --text4:#9C8570;
        --amber:#C17D2C; --amber-soft:#FDF3E1; --amber-mid:#FADDAA; --amber-dark:#8C5A1A;
        --rust:#B54A2A; --rust-soft:#FAF0EB; --rust-mid:#F4C4B0;
        --teal:#2A7B6B; --teal-soft:#E8F4F1; --teal-mid:#B0D9D0;
        --navy:#1E2F4D; --slate:#4A5E7A;
        --purple:#6B4FA0; --purple-soft:#F3EEFB;
        --green:#2E7D4F; --green-soft:#EBF5EE;
        --red:#B83232; --red-soft:#FAE8E8;
        color-scheme: light;
      }
      [data-theme="dark"] {
        --bg:#0F1117; --surface:#181C24; --surface2:#1E2330; --surface3:#252C3A;
        --border:#2E3548; --border-light:#252C3A;
        --text:#EEF0F5; --text2:#8E99B0; --text3:#7C87A8; --text4:#626D8C;
        --amber:#E09A38; --amber-soft:#1F1A0E; --amber-mid:#3D3010; --amber-dark:#F0B84A;
        --rust:#D46040; --rust-soft:#1E1008; --rust-mid:#3D2418;
        --teal:#3DB89A; --teal-soft:#0D1F1C; --teal-mid:#163830;
        --navy:#3A5080; --slate:#7A94BC;
        --purple:#9A78D0; --purple-soft:#160F28;
        --green:#3DAA50; --green-soft:#0C1C10;
        --red:#E04040; --red-soft:#200808;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg:#0F1117; --surface:#181C24; --surface2:#1E2330; --surface3:#252C3A;
          --border:#2E3548; --border-light:#252C3A;
          --text:#EEF0F5; --text2:#8E99B0; --text3:#7C87A8; --text4:#626D8C;
          --amber:#E09A38; --amber-soft:#1F1A0E; --amber-mid:#3D3010; --amber-dark:#F0B84A;
          --rust:#D46040; --rust-soft:#1E1008; --rust-mid:#3D2418;
          --teal:#3DB89A; --teal-soft:#0D1F1C; --teal-mid:#163830;
          --navy:#3A5080; --slate:#7A94BC;
          --purple:#9A78D0; --purple-soft:#160F28;
          --green:#3DAA50; --green-soft:#0C1C10;
          --red:#E04040; --red-soft:#200808;
          color-scheme: dark;
        }
      }
      body {
        background: var(--bg);
        transition: background .15s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* Thin, theme-aware scrollbars instead of the bulky OS default —
         reads noticeably more polished on a dense data app like this. */
      * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
      ::-webkit-scrollbar { width: 9px; height: 9px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
      ::-webkit-scrollbar-thumb:hover { background: var(--text3); background-clip: padding-box; }

      ::selection { background: var(--amber-mid); color: var(--text); }
      .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

      /* Keyboard-only focus rings: visible when tabbing, silent on mouse
         click so buttons/cards don't get a ring on every pointer interaction.
         App.jsx layers more specific button/input/select rules on top of
         this — this is just the catch-all for everything else (links,
         custom tabindex elements, etc). */
      :focus { outline: none; }
      :focus-visible { outline: 2px solid var(--amber) !important; outline-offset: 2px; border-radius: 2px; }
    </style>
    <style>
      @media (max-width: 720px) {
        .skip-sidebar { width: 72px !important; }
        .skip-sidebar > div:first-child { padding: 10px 8px 9px !important; }
        .skip-sidebar-logo { width: 56px !important; margin: 0 auto 8px !important; }
        .skip-sidebar > div:first-child > div { margin: 0 auto; padding: 3px 5px !important; }
        .skip-sidebar > div:first-child > div span { font-size: 8px !important; letter-spacing: 0 !important; }
        .skip-sidebar > div:nth-child(2) { padding: 8px 6px !important; }
        .skip-sidebar > div:nth-child(2) > button { justify-content: center; gap: 0 !important; padding: 8px 4px !important; }
        .skip-sidebar .skip-nav-section,
        .skip-sidebar .skip-nav-label,
        .skip-sidebar .skip-nav-shortcut,
        .skip-sidebar .skip-utility-label { display: none; }
        .skip-sidebar > div:nth-child(2) > button > span:first-child { width: 24px !important; }
        .skip-sidebar > div:nth-child(2) > button > span:last-child:not(.skip-nav-label):not(.skip-nav-shortcut) {
          margin-left: 0 !important; padding: 1px 4px !important; font-size: 9px !important;
        }
        .skip-sidebar-insight { display: none; }
        .skip-topbar { padding: 0 12px !important; }
        .skip-topbar > div:nth-child(3), .skip-topbar > div:nth-child(4) { display: none; }
        .skip-content { padding: 12px 12px 20px !important; overflow-x:hidden !important; }
        .skip-content > * { min-width:0; }
        .skip-topbar { height:50px !important; }
        .skip-topbar > div:first-child { font-size:13px !important; }
        .skip-topbar button, .skip-sidebar button, .skip-content button, .skip-content select { min-height:36px; }
        .skip-content select { max-width:100%; }
        .overview-responsive-grid { grid-template-columns: 1fr !important; gap: 10px !important; }
        .overview-responsive-grid > * { min-width:0; }
        .skip-stat-strip { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
        .skip-stat-strip > div { min-height:78px; }
        .skip-sidebar button:hover { transform:none !important; }
        .skip-player-hero { flex-direction:column !important; overflow-x:hidden !important; }
        .skip-player-hero > div { min-width:0 !important; width:100% !important; border-right:0 !important; border-bottom:1px solid var(--border-light); }
        .skip-player-hero > div:last-child { border-bottom:0; }
        .skip-player-main-grid { grid-template-columns:1fr !important; gap:10px !important; }
        .skip-player-main-grid > * { min-width:0; }
        .skip-prospect-summary-grid { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
        .skip-prospect-summary-grid > div { min-height:82px; border-bottom:1px solid var(--border-light); }
        .skip-prospect-workspace-grid { grid-template-columns:1fr !important; gap:10px !important; }
        .skip-prospect-workspace-grid > * { min-width:0; }
      }
    </style>
    <style>
      @media (max-width: 720px) {
        .skip-mobile-nav-toggle { display:inline-flex !important; }
        .skip-sidebar { position:fixed !important; inset:0 auto 0 0; z-index:80; width:min(286px, calc(100vw - 48px)) !important; transform:translateX(-105%); transition:transform 180ms cubic-bezier(.23,1,.32,1); box-shadow:none !important; }
        .skip-sidebar.skip-mobile-nav-open { transform:translateX(0); box-shadow:14px 0 34px rgba(20,31,48,.18) !important; }
        .skip-sidebar .skip-nav-section, .skip-sidebar .skip-nav-label, .skip-sidebar .skip-nav-shortcut, .skip-sidebar .skip-utility-label { display:block; }
        .skip-sidebar > div:nth-child(2) > button { justify-content:flex-start; gap:8px !important; padding:9px 10px !important; min-height:42px; }
        .skip-sidebar > div:nth-child(2) > button > span:first-child { width:24px !important; }
        .skip-sidebar > div:nth-child(2) > button > span:last-child:not(.skip-nav-label):not(.skip-nav-shortcut) { margin-left:auto !important; }
        .skip-sidebar-insight { display:block; }
        .skip-mobile-nav-backdrop { display:block; position:fixed; inset:0; z-index:70; border:0; background:rgba(15,24,38,.34); backdrop-filter:blur(2px); }
      }
      @media (prefers-reduced-motion: reduce) { .skip-sidebar { transition:none !important; } }
    </style>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .skip-feed-skeleton [style*="animation"] { animation: none !important; opacity: .72; }
      }
      @media (max-width: 720px) {
        .skip-overview-page .skip-affiliate-overview-grid {
          display: flex !important;
          flex-wrap: wrap !important;
          align-items: flex-start !important;
          gap: 8px !important;
        }
        .skip-overview-page .skip-affiliate-overview-grid > div:first-child {
          flex: 1 1 100% !important;
          width: 100% !important;
          grid-column: auto !important;
        }
        .skip-overview-page .skip-affiliate-overview-grid > div:not(:first-child) {
          flex: 1 1 0 !important;
          min-width: 0 !important;
          text-align: center !important;
          padding-left: 4px !important;
          padding-right: 4px !important;
        }
      }
    </style>
    <style>
      @media (max-width: 720px) {
        .skip-farm-summary-main { grid-template-columns: 1fr !important; gap: 10px !important; }
        .skip-farm-summary-rankings { grid-template-columns: 1fr !important; }
      }
    </style>
    <script>
      // Apply saved/system theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('skip-theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="preload" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);">
        <div style="display:flex;align-items:center;gap:10px;font-family:'Plus Jakarta Sans',Arial,sans-serif;color:var(--text3);">
          <div style="width:8px;height:8px;border-radius:50%;background:var(--amber);animation:preload-pulse 1.1s ease-in-out infinite;"></div>
          <span style="font-size:13px;font-weight:600;letter-spacing:.02em;">Loading SKIP…</span>
        </div>
      </div>
    </div>
    <style>
      @keyframes preload-pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(.7); } }
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
